[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-agent-emotion"
version = "0.1.0"
description = "Model-agnostic affect/state engine for Python AI agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Xarksus"}]
license = {text = "MIT"}
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
