name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q
      - name: Verify Community boundary
        run: |
          test ! -f src/adaptive_agent_emotion/observer.py
          test ! -f src/adaptive_agent_emotion/advisor.py
      - name: Privacy scan public content
        run: |
          ! grep -RniE 'Kira|Thorsten|\.kira|\.config/kira|OpenRouter|Gemini|PayPal|password|api[_-]?key|token|secret' src tests README.md PRO.md --exclude='*.pyc'
